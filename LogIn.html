 
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Login</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 25px;
            background-color: #eaf5ed;
            font-family: Arial, sans-serif;
        }

        .login-container {
            width: 100%;
            max-width: 450px;
            margin: 0 auto;
            background: white;
            border: 1px solid #b8d8c1;
            box-shadow: 0 5px 15px rgba(0, 80, 35, 0.12);
        }

        .login-header {
            background: #176b3a;
            color: white;
            text-align: center;
            padding: 22px;
        }

        .login-header h1 {
            font-size: 25px;
            margin: 0;
        }

        .login-form {
            padding: 22px 20px 15px;
        }

        .form-row {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 22px;
        }

        label {
            width: 36%;
            color: #176b3a;
            font-weight: bold;
        }

        input {
            width: 64%;
            min-width: 0;
            padding: 12px 10px;
            border: 1px solid #62a879;
            border-radius: 5px;
            font-size: 14px;
        }

        input:focus {
            outline: 2px solid #b7e0c2;
            border-color: #176b3a;
        }

        .buttons {
            display: flex;
            justify-content: center;
            gap: 14px;
            padding: 18px;
            background: #f1f7f2;
            border-top: 1px solid #d4e7d8;
        }

        button {
            border: none;
            padding: 12px 25px;
            border-radius: 5px;
            color: white;
            font-size: 15px;
            cursor: pointer;
        }

        .submit-btn {
            background: #238348;
        }

        .submit-btn:hover {
            background: #176b3a;
        }

        .reset-btn {
            background: #42594a;
        }

        .reset-btn:hover {
            background: #293b30;
        }

        #message {
            text-align: center;
            color: #176b3a;
            padding: 0 15px;
            font-size: 14px;
        }

        .login-footer {
            text-align: center;
            padding: 18px 10px;
            color: #176b3a;
            background: white;
            border-top: 1px solid #d4e7d8;
            font-size: 13px;
            font-weight: bold;
        }

        @media (max-width: 400px) {
            .form-row {
                display: block;
            }

            label,
            input {
                display: block;
                width: 100%;
            }

            label {
                margin-bottom: 8px;
            }
        }
    </style>
</head>

<body>

    <div class="login-container">

        <header class="login-header">
            <h1>Portal Login</h1>
        </header>

        <form id="loginForm">
            <div class="login-form">

                <div class="form-row">
                    <label for="username">Username:</label>
                    <input
                        type="text"
                        id="username"
                        placeholder="Enter Username"
                        required
                    >
                </div>

                <div class="form-row">
                    <label for="password">Password:</label>
                    <input
                        type="password"
                        id="password"
                        placeholder="Enter Password"
                        required
                    >
                </div>

            </div>

            <div class="buttons">
                <button type="submit" class="submit-btn">Submit</button>
                <button type="reset" class="reset-btn">Reset</button>
            </div>

            <p id="message" role="status"></p>
        </form>

        <footer class="login-footer">
            Created by: Wentworth Dale Cambel - [12] - [Cooper]
        </footer>

    </div>

    <script>
        document.getElementById("loginForm").addEventListener("submit", function(event) {
            event.preventDefault();

            const username = document.getElementById("username").value.trim();
            const password = document.getElementById("password").value;
            const message = document.getElementById("message");

            if (username === "" || password === "") {
                message.textContent = "Please enter your username and password.";
                return;
            }

            message.textContent = "Form submitted successfully!";
        });

        document.getElementById("loginForm").addEventListener("reset", function() {
            document.getElementById("message").textContent = "";
        });
    </script>

</body>
</html>
